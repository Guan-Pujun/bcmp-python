[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcmp"
version = "1.0.0"
description = "Batch-Constraint Manifold Partition (BCMP) for evaluating batch-effect removal in single-cell integration."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1.3,<3",
  "pandas>=2.2.3,<3",
  "scipy>=1.15.3,<2",
  "numba>=0.62.1,<0.66",
  "annoy>=1.17.3,<2",
  "igraph>=0.11.2,<1.1",
  "leidenalg>=0.10.1,<0.12",
  "anndata>=0.11.3,<0.13",
  "scikit-learn>=1.6,<2",
  "scikit-misc>=0.5.1,<0.6",
  "umap-learn>=0.5.8,<0.6",
]

[project.optional-dependencies]
docs = [
  "matplotlib>=3.10,<4",
  "pydata-sphinx-theme>=0.20,<0.21",
  "scib-metrics>=0.5.7,<0.6",
  "sphinx>=9,<10",
  "sphinx-copybutton>=0.5,<0.6",
  "sphinx-gallery>=0.21,<0.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bcmp*"]

[tool.setuptools.package-data]
"bcmp.datasets" = ["_data/*.h5ad"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]

[tool.coverage.run]
source = ["bcmp"]
relative_files = true

[tool.coverage.paths]
source = [
  "src/bcmp",
  "*/site-packages/bcmp",
]
