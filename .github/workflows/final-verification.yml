name: Final clean-environment verification
on:
  push:
    branches: ["verify/python-1.0.0-clean"]
permissions:
  contents: read
env:
  CANDIDATE_SHA: 03021124c76d35a7347b1b85d1b4338f1b399727
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build wheel from sdist and audit both distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist candidate
          python -m twine check --strict dist/*
          python .release-check/audit.py candidate dist > package-audit.json
          cat package-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-content-audit
          path: package-audit.json
          if-no-files-found: error
  pip-platforms:
    needs: artifacts
    name: Clean ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-distributions
          path: dist
      - name: Install and test in a new isolated environment outside the checkout
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bcmp-clean"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            check_python="$RUNNER_TEMP/bcmp-clean/Scripts/python.exe"
          else
            check_python="$RUNNER_TEMP/bcmp-clean/bin/python"
          fi
          "$check_python" .release-check/verify.py candidate dist "$RUNNER_TEMP/verification-results" 2>&1 | tee verification.log
      - name: Preserve environment and regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-${{ matrix.os }}-${{ matrix.python }}
          path: |
            verification.log
            ${{ runner.temp }}/verification-results/environment.json
            ${{ runner.temp }}/verification-results/tests.xml
  conda-macos:
    needs: artifacts
    name: Clean Apple Silicon Python ${{ matrix.python }}
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Prepare a version-specific copy of the approved Conda environment
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path("candidate/envs/bcmp.yml").read_text()
          assert source.count("python=3.12") == 1
          Path("verification-env.yml").write_text(source.replace("python=3.12", "python=" + os.environ["TEST_PYTHON"]))
          PY
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-file: verification-env.yml
          environment-name: bcmp-clean
          cache-environment: false
          cache-downloads: false
          post-cleanup: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-distributions
          path: dist
      - name: Install and test outside the checkout
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          python .release-check/verify.py candidate dist "$RUNNER_TEMP/verification-results" --conda 2>&1 | tee verification.log
      - name: Preserve environment and regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-macos-arm64-${{ matrix.python }}
          path: |
            verification.log
            ${{ runner.temp }}/verification-results/environment.json
            ${{ runner.temp }}/verification-results/tests.xml
  sonar:
    name: Candidate SonarQube quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/python-1.0.0
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate revision
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Generate candidate coverage
        run: |
          python -m pip install . pytest pytest-cov
          python -m pytest tests -q --cov=bcmp --cov-report=xml --cov-fail-under=90
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=guan-pujun
            -Dsonar.projectKey=Guan-Pujun_bcmp-python
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.pullrequest.key=11
            -Dsonar.pullrequest.branch=release/python-1.0.0
            -Dsonar.pullrequest.base=main
            -Dsonar.scm.revision=03021124c76d35a7347b1b85d1b4338f1b399727
            -Dsonar.qualitygate.wait=true
