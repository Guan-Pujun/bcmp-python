name: Build

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/package.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: python -m pip install build && python -m build

      - name: Install and inspect the wheel
        run: |
          python -m venv /tmp/bcmp-wheel-test
          /tmp/bcmp-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/bcmp-wheel-test/bin/python -c "from bcmp.datasets import diabetic_kidney_lite; assert diabetic_kidney_lite().shape == (1500, 27980)"

      - name: Install the source distribution
        run: |
          python -m venv /tmp/bcmp-sdist-test
          /tmp/bcmp-sdist-test/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/bcmp-sdist-test/bin/python -c "from bcmp import bcmp, bcmp_embedding"
