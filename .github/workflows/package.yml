name: Build

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/package.yml"
      - ".github/actions/ci-scope/**"
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Determine check scope
        id: scope
        uses: ./.github/actions/ci-scope

      - name: Set up Python
        if: steps.scope.outputs.build == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        if: steps.scope.outputs.build == 'true'
        run: python -m pip install build && python -m build

      - name: Install and inspect the wheel
        if: steps.scope.outputs.build == 'true'
        run: |
          python -m venv /tmp/bcmp-wheel-test
          /tmp/bcmp-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/bcmp-wheel-test/bin/python -c "from bcmp.datasets import diabetic_kidney_lite; assert diabetic_kidney_lite().shape == (1500, 27980)"

      - name: Install the source distribution
        if: steps.scope.outputs.build == 'true'
        run: |
          python -m venv /tmp/bcmp-sdist-test
          /tmp/bcmp-sdist-test/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/bcmp-sdist-test/bin/python -c "from bcmp import bcmp, bcmp_embedding"
