name: Clean Windows verification retry
on:
  push:
    branches: ["verify/python-1.0.0-clean"]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 03021124c76d35a7347b1b85d1b4338f1b399727
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-distributions
          path: dist
          run-id: 35539560174
          github-token: ${{ github.token }}
      - name: Install and test in a new isolated environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bcmp-clean"
          "$RUNNER_TEMP/bcmp-clean/Scripts/python.exe" .release-check/verify.py candidate dist "$RUNNER_TEMP/verification-results" 2>&1 | tee verification.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-windows-latest-${{ matrix.python }}
          path: |
            verification.log
            ${{ runner.temp }}/verification-results/environment.json
            ${{ runner.temp }}/verification-results/tests.xml
