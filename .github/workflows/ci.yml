name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: ${{ matrix.os }} · Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Determine check scope
        id: scope
        uses: ./.github/actions/ci-scope

      - name: Set up Python
        if: steps.scope.outputs.tests == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and test runner
        if: steps.scope.outputs.tests == 'true'
        run: python -m pip install . pytest pytest-cov

      - name: Run test suite
        if: steps.scope.outputs.tests == 'true'
        run: python -m pytest tests -q --cov=bcmp --cov-report=xml --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: ${{ steps.scope.outputs.tests == 'true' && matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073 # v5.5.5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: true

  macos-conda:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: macOS Apple Silicon · Conda-forge · Python 3.12
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Determine check scope
        id: scope
        uses: ./.github/actions/ci-scope

      - name: Set up Conda-forge environment
        if: steps.scope.outputs.tests == 'true'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: envs/bcmp.yml
          environment-name: bcmp
          post-cleanup: all

      - name: Install bcmp
        if: steps.scope.outputs.tests == 'true'
        run: python -m pip install --no-deps .
        shell: micromamba-shell {0}

      - name: Install test runner
        if: steps.scope.outputs.tests == 'true'
        run: python -m pip install pytest
        shell: micromamba-shell {0}

      - name: Run test suite
        if: steps.scope.outputs.tests == 'true'
        run: python -m pytest tests -q
        shell: micromamba-shell {0}

  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Determine check scope
        id: scope
        uses: ./.github/actions/ci-scope

      - name: Set up Python
        if: steps.scope.outputs.tests == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        if: steps.scope.outputs.tests == 'true'
        run: python -m pip install ruff==0.16.4 mypy

      - name: Lint Python sources
        if: steps.scope.outputs.tests == 'true'
        run: python -m ruff check src tests

      - name: Check Python formatting
        if: steps.scope.outputs.tests == 'true'
        run: python -m ruff format --check src tests

      - name: Check public Python types
        if: steps.scope.outputs.tests == 'true'
        run: python -m mypy --ignore-missing-imports src/bcmp
