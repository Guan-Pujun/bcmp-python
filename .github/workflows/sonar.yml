name: SonarQube Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and test runner
        run: python -m pip install . pytest pytest-cov

      - name: Generate coverage report
        run: python -m pytest tests -q --cov=bcmp --cov-report=xml --cov-fail-under=90

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=guan-pujun
            -Dsonar.projectKey=Guan-Pujun_bcmp-python-prerelease
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true
