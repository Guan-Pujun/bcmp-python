<div class="bcmp-package-sidebar">
  <a class="bcmp-package-sidebar__logo" href="{{ pathto('index') }}" aria-label="BCMP Py manual home">
    <img
      class="only-light"
      src="{{ pathto('_static/bcmp-python-light.svg', 1) }}"
      alt="BCMP Py Python package logo"
    >
    <img
      class="only-dark pst-js-only"
      src="{{ pathto('_static/bcmp-python-dark.svg', 1) }}"
      alt="BCMP Py Python package logo"
    >
  </a>
  <div class="bcmp-package-switcher" aria-label="BCMP package manuals">
    <span class="bcmp-package-switcher__current" aria-current="page">BCMP<sup>Py</sup></span>
    <span class="bcmp-package-switcher__separator" aria-hidden="true">/</span>
    {% if bcmp_r_docs_url %}
      <a href="{{ bcmp_r_docs_url }}">BCMP<sup>R</sup></a>
    {% elif pagename == "method" %}
      <a href="#choose-an-implementation" title="Compare the Python and R packages">BCMP<sup>R</sup></a>
    {% else %}
      <a href="{{ pathto('method') }}#choose-an-implementation" title="Compare the Python and R packages">BCMP<sup>R</sup></a>
    {% endif %}
  </div>
</div>
