name: bcmp
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - "pip>=25,<27"
  - "numpy>=2.1.3,<3"
  - "pandas>=2.2.3,<3"
  - "scipy>=1.15.3,<2"
  - "numba>=0.62.1,<0.66"
  - "python-annoy>=1.17.3,<2"
  - "python-igraph>=0.11.2,<1.1"
  - "leidenalg>=0.10.1,<0.12"
  - "anndata>=0.11.3,<0.13"
  - "scikit-learn>=1.6,<2"
  - "umap-learn>=0.5.8,<0.6"
  # Use PyPI wheels: current Conda builds report version 0.0.0.
  - pip:
      - "scikit-misc>=0.5.1,<0.6"
